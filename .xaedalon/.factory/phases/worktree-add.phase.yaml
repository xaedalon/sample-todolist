# Runs in the repository itself: the worktree does not exist yet, so there is
# nowhere else for it to run. Every later phase runs inside the worktree, which
# Factory works out by looking for it rather than by trusting the flag.
kind: factory.phase/v1
name: worktree-add
description: Add the task's worktree, on its own branch, from the default branch.
steps:
  # The branch is derived, so a branch typed into the task would be silently
  # ignored — and a field that is read by nothing is worse than a field that is
  # not offered. Say so instead.
  - run: |
      typed="{{ task.branch }}"
      derived="task/{{ task.directory }}"
      if [ -n "$typed" ] && [ "$typed" != "$derived" ]; then
        echo "This project derives the branch as \"$derived\", so the task's own" >&2
        echo "branch \"$typed\" would be ignored. Clear the Branch field on the task," >&2
        echo "or change the branch in worktree-add.phase.yaml." >&2
        exit 1
      fi
      echo "branch: $derived"

  # The step kind, not a hand-written `git worktree add`. It is idempotent —
  # a directory that is already there, or a branch that already exists, is not
  # an error — which is what makes a failed task retryable.
  - uses: worktree
    action: create
    path: "{{ project.worktrees }}/{{ task.directory }}"
    branch: "task/{{ task.directory }}"
    from: "{{ project.branch }}"
