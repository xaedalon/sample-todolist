kind: factory.phase/v1
name: worktree-remove
description: Remove the task's worktree, refusing while it holds unmerged commits.
steps:
  # Removal is `--force`, deliberately: an agent leaves untracked files behind
  # and a remove that refuses over one leaves a task unable to finish. Which
  # means this guard is the only thing standing between a branch nobody merged
  # and `--force`.
  - run: |
      set -e
      repo="{{ project.path }}"
      branch="task/{{ task.directory }}"
      if ! git -C "$repo" show-ref --verify --quiet "refs/heads/$branch"; then
        echo "no branch $branch — nothing to check"
        exit 0
      fi
      ahead=$(git -C "$repo" rev-list --count "{{ project.branch }}..$branch")
      if [ "$ahead" != "0" ]; then
        echo "Refusing: $branch has $ahead commit(s) that {{ project.branch }} does not have." >&2
        echo "Run the merge workflow, or if this work is being abandoned on purpose:" >&2
        echo "  git -C \"$repo\" worktree remove --force \"{{ project.worktrees }}/{{ task.directory }}\"" >&2
        echo "  git -C \"$repo\" branch -D $branch" >&2
        exit 1
      fi
      echo "$branch is contained in {{ project.branch }} — safe to remove"
      # Commits are guarded above; uncommitted changes are not, because the
      # removal below is `--force` and refusing over a stray file would leave a
      # task unable to finish. Say what is being discarded, so the run log has
      # it even though nobody is watching.
      dirty=$(git -C "{{ project.worktrees }}/{{ task.directory }}" status --porcelain 2>/dev/null || true)
      if [ -n "$dirty" ]; then
        echo "discarding uncommitted changes in the worktree:"
        echo "$dirty" | sed 's/^/  /'
      fi

  # Written out rather than `uses: worktree, action: remove`, for one reason
  # that is worth knowing about: **this phase runs inside the worktree it is
  # removing.** Factory puts a phase in the task's worktree whenever the
  # worktree exists, so the built-in step — which removes the directory and
  # then runs `git worktree prune` — prunes from a working directory that no
  # longer exists:
  #
  #     fatal: Unable to read current working directory: No such file or directory
  #
  # git has already cleaned up `.git/worktrees/<name>` by then, so nothing is
  # left behind; the step just fails, and a task whose work merged perfectly
  # well ends up looking like a failure. `cd` to the repository first and it is
  # correct again. That is why the built-in asks to be overridden.
  - run: |
      set -e
      repo="{{ project.path }}"
      dir="{{ project.worktrees }}/{{ task.directory }}"
      cd "$repo"
      if [ -d "$dir" ]; then
        git worktree remove --force "$dir"
        echo "removed $dir"
      else
        echo "no worktree at $dir"
      fi
      git worktree prune
      echo "branch $(git rev-parse --abbrev-ref HEAD) is at $(git rev-parse --short HEAD); task/{{ task.directory }} kept"
