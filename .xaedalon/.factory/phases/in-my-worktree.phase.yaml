kind: factory.phase/v1
name: in-my-worktree
description: Refuse to let an agent work anywhere but this task's own worktree.
steps:
  # The guard that should not be needed, and is.
  #
  # Every work workflow declares `requires: [hasWorktree, hasEnvironment]`, and
  # the scheduler is supposed to hold a task back until it holds those flags.
  # It does not check the workflow that is about to run: it checks the newest
  # run's workflow, or failing that the *first entry in the task's list* —
  # `packages/engine/src/scheduler.ts`, `#factsFor`. Untick `worktree-create`
  # on a task and the entry is still first, still says `requires: []`, and the
  # task is admitted; the engine then runs the first *ticked* workflow, whose
  # requirements nobody looked at.
  #
  # That is not hypothetical. It happened here on 2026-09-18: a task with the
  # two lifecycle workflows unticked ran all five work phases in the project's
  # own working copy, on `main`, and its agents committed there twice — while
  # another task's merge was in flight, which is what broke that merge. The
  # gate exists because "a phase that assumes a worktree does damage without
  # one", and this is the shape of the damage.
  #
  # So the check runs where nothing can route around it: in the phase itself,
  # first, in every work workflow. One file, five references.
  - run: |
      set -e
      expected="{{ project.worktrees }}/{{ task.directory }}"
      here=$(pwd -P)
      want=$(cd "$expected" 2>/dev/null && pwd -P || echo "$expected")
      if [ "$here" != "$want" ]; then
        echo "This phase is running in $here, which is not this task's worktree." >&2
        echo "Expected $want." >&2
        echo >&2
        echo "Almost always this means \"worktree-create\" is not ticked on this task," >&2
        echo "so the work would happen in the project's own working copy — where it" >&2
        echo "would collide with every other task and with any merge in flight." >&2
        echo "Tick worktree-create and environment-create, then queue it again." >&2
        exit 1
      fi
      echo "in $here"
