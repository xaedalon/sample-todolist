kind: factory.phase/v1
name: merge-recover
description: Diagnose a failed merge and leave the branch ready to land.
steps:
  # First, let go of the lock — but only if this task is the one holding it.
  #
  # The merge takes the lock before the agent step and releases it after the
  # fast-forward, so a failure in between leaves it held by a task that is not
  # going to come back for it. Every other merge would then wait ten minutes.
  # Checking the owner matters: by the time a recovery runs, the lock may
  # legitimately belong to somebody else's merge.
  - run: |
      lock="{{ project.path }}/.git/factory-merge.lock"
      if [ ! -d "$lock" ]; then
        echo "no merge lock held"
      elif [ "$(cat "$lock/owner" 2>/dev/null)" = "{{ task.uuid }}" ]; then
        rm -rf "$lock"
        echo "released the merge lock this task was holding"
      else
        echo "the lock belongs to $(cat "$lock/owner" 2>/dev/null || echo 'another task') — leaving it alone"
      fi

  - agent: developer
    artifact: merge-repair
    prompt: >-
      The `{{ project.failedWorkflow }}` workflow for this task failed in its
      `{{ project.failedPhase }}` phase, and Factory reported this:


      {{ project.failureReason }}


      You are in the task's worktree on branch `task/{{ task.directory }}`. Nothing has been
      cleaned up: the worktree, the branch and every commit on it are exactly as they were.
      Work out what actually went wrong and put the branch back into a state that can be
      fast-forwarded into `{{ project.branch }}` — which usually means finishing or redoing the
      merge of `{{ project.branch }}` into this branch, resolving the conflicts properly, and
      committing so that `git status` is clean and `git merge-base --is-ancestor
      {{ project.branch }} task/{{ task.directory }}` succeeds.


      Some failures are not yours to fix, and saying so is the right answer. If the repository
      at {{ project.path }} is on the wrong branch or has uncommitted changes of somebody
      else's, leave it alone and say what a person has to do. If a stale
      `.git/factory-merge.lock` is the problem, say which directory to remove rather than
      removing it — a lock might be held by a merge that is still running.


      The same four rules as the merge itself: nothing outside this worktree, no `push`, no
      `rebase`, `reset --hard` or amending commits already on the branch, no deleting branches,
      and do not merge into `{{ project.branch }}` yourself. The step that does that runs again
      when somebody retries this task.


      Write the artifact for whoever opens this task: what failed, what you changed, whether a
      retry will now work, and what is left for a person to do if anything is.
