kind: factory.phase/v1
name: merge-integrate
description: Commit the task's work, let the agent integrate the default branch, then fast-forward it.
steps:
  # 1. Commit what the task produced. Deterministic on purpose.
  #
  # Nothing in Factory commits for you: the agents wrote files in the worktree
  # and left them there, and the worktree is removed with `--force` two phases
  # from now — so this step is what turns a run into work somebody keeps. It is
  # a shell step rather than the agent's job because there is no judgement in
  # it, and because the agent below should start from a clean tree.
  - run: |
      set -e
      if [ -z "$(git status --porcelain)" ]; then
        echo "working tree already clean"
        exit 0
      fi
      # The task's name goes through a quoted heredoc rather than straight into
      # the command line. A step is a shell script and a task name is somebody
      # else's text; the two should never meet unquoted.
      name=$(cat <<'TASK_NAME'
      {{ task.name }}
      TASK_NAME
      )
      git add -A
      git commit -q -m "$name" -m "Factory task {{ task.uuid }}"
      echo "committed:"
      git --no-pager log --oneline -1

  # 2. Take the merge lock, and hold it across the agent step below.
  #
  # Measured the hard way. With the lock around only the fast-forward, two
  # tasks merging together did this: both agents ran while the default branch
  # was still where they had branched from, both reported "already up to date",
  # the first fast-forwarded, and the second found the branch had moved under a
  # merge it had already declared finished — a conflict, with the agent gone.
  # It recovered (`on_fail` below, and it recovered well) but it needed a human
  # to press Retry, and the point of this pipeline is that it does not.
  #
  # So the lock covers the decision *and* the write. One task integrates at a
  # time; everything up to `verify` still runs in parallel, which is where the
  # time actually goes.
  #
  # Why `mkdir`: it is the atomic create-if-absent that exists everywhere.
  # `flock` is not on macOS. Why no `trap` here: the lock has to outlive this
  # step — it is released by step 4, or by `merge-repair` if the agent fails,
  # or by the age-out below if a task was killed outright.
  - run: |
      set -e
      lock="{{ project.path }}/.git/factory-merge.lock"
      for attempt in $(seq 1 600); do
        if mkdir "$lock" 2>/dev/null; then
          echo "{{ task.uuid }}" > "$lock/owner"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$lock/since"
          echo "holding the merge lock"
          exit 0
        fi
        if [ "$attempt" = 1 ]; then
          echo "another task is merging — waiting (held by $(cat "$lock/owner" 2>/dev/null || echo 'unknown') since $(cat "$lock/since" 2>/dev/null || echo 'unknown'))"
        fi
        # A merge takes seconds to a couple of minutes. Half an hour means the
        # task holding it was killed between taking it and releasing it, and
        # nothing will ever come back for it.
        if [ -n "$(find "$lock" -maxdepth 0 -mmin +30 2>/dev/null)" ]; then
          echo "the lock is over 30 minutes old — the task that took it is gone. Breaking it." >&2
          rm -rf "$lock"
        fi
        sleep 1
      done
      echo "Ten minutes waiting for $lock, which is longer than any merge should take." >&2
      echo "If nothing is merging, remove that directory." >&2
      exit 1

  # 3. The agent integrates the default branch.
  #
  # This is the step that used to be `git merge --no-edit` and a failure. A
  # conflict is a judgement — whose intention survives, and how the two are
  # reconciled — and the agent that wrote this code is the one holding the
  # context to make it (`session: task` means this is the same conversation as
  # the analysis, the implementation and the review).
  #
  # It happens *here*, in the worktree and under the lock, which is the whole
  # reason this phase is ordered the way it is: a bad merge costs one task's
  # branch, never the default branch. Measured against Copilot on a real
  # conflict — it merged, resolved by keeping both sides, committed, and
  # reported that nothing had been refused. A confined agent can do git work
  # inside its own worktree.
  - agent: developer
    artifact: merge
    prompt: >-
      You are in this task's git worktree, on branch `task/{{ task.directory }}`, and the work
      has just been committed. Your job is to make this branch ready to fast-forward into
      `{{ project.branch }}`, which another task may have moved while you were working.


      Run `git merge --no-edit {{ project.branch }}`. If it reports that the branch is already
      up to date, you are done — say so. If it conflicts, resolve every conflict properly:
      read both sides, keep both intentions where they are compatible, and where they are not,
      keep the behaviour described in PROJECT.md and in this task's own analysis at
      {{ task.artifacts }}/analysis/analysis.md. Never resolve a conflict by throwing one side
      away because it is easier. If the repository has tests, run them afterwards and say
      whether they pass. Then stage the resolution and commit it.


      Finish only when `git status` is clean and `git merge-base --is-ancestor
      {{ project.branch }} task/{{ task.directory }}` succeeds — that is what the next step
      checks, and it is what makes the merge into {{ project.branch }} a fast-forward.


      Four things you must not do. Do not touch anything outside this worktree — the repository
      at {{ project.path }} is not yours to write to, and the next step handles it. Do not
      `push`, `rebase`, `reset --hard`, or amend a commit that is already on the branch:
      history that other tasks have merged is shared, and rewriting it is how work disappears.
      Do not delete a branch. Do not merge your branch into {{ project.branch }} yourself.


      Write the artifact as a record of the merge: what the conflicts were, how you decided
      each one, what the tests said, and anything you could not finish.

  # 4. Fast-forward the default branch, and release the lock.
  #
  # Mechanical by design: the agent has left the branch containing the default
  # branch, so this either applies completely or does nothing at all. There is
  # no state in between for a half-done merge to sit in, and the one write to
  # shared state in this whole pipeline is the one operation with no judgement
  # in it.
  - run: |
      set -e
      repo="{{ project.path }}"
      main="{{ project.branch }}"
      branch="task/{{ task.directory }}"
      lock="$repo/.git/factory-merge.lock"
      [ -n "$repo" ] || { echo "no project path" >&2; exit 1; }
      trap 'rm -rf "$lock"' EXIT INT TERM

      if [ "$(git rev-list --count "$main..$branch")" = "0" ]; then
        echo "Nothing to merge: $branch has no commits that $main does not already have."
        echo "If that is a surprise, the work was never committed, or everything it"
        echo "wrote is covered by .gitignore."
        exit 0
      fi

      on=$(git -C "$repo" rev-parse --abbrev-ref HEAD)
      if [ "$on" != "$main" ]; then
        echo "$repo is on \"$on\", not \"$main\", so this cannot be merged into it." >&2
        echo "  git -C \"$repo\" checkout $main" >&2
        exit 1
      fi
      if [ -n "$(git -C "$repo" status --porcelain)" ]; then
        echo "$repo has uncommitted changes, so merging into $main would not be safe:" >&2
        git -C "$repo" --no-pager status --short >&2
        exit 1
      fi

      # The agent was asked to leave this true, and holding the lock since
      # before it ran is what makes it stay true. If it is not, the agent did
      # not finish its job: a plain merge is the net, and a conflict here is
      # handed to `merge-repair` rather than guessed at.
      if ! git merge-base --is-ancestor "$main" "$branch"; then
        echo "the branch does not contain $main — merging it here"
        if ! git merge --no-edit "$main"; then
          git merge --abort || true
          echo "\"$main\" does not merge cleanly into $branch, and the merge agent left it that way." >&2
          echo "merge-repair runs next; retry this task afterwards." >&2
          exit 1
        fi
      fi

      git -C "$repo" merge --ff-only "$branch"
      echo "merged $branch into $main:"
      git -C "$repo" --no-pager log --oneline -1
