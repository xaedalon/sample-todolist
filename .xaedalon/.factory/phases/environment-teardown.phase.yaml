kind: factory.phase/v1
name: environment-teardown
description: Remove this worktree's installed dependencies. Never the repository's.
steps:
  # Named absolutely, not relative to where this happens to be running.
  #
  # `rm -rf node_modules` would be the obvious way to write this and it is a
  # trap: Factory runs a phase in the worktree *if the worktree is there*, and
  # in the repository itself if it is not. So on a task whose worktree had
  # already been removed, the obvious version would delete the repository's own
  # dependencies instead. This one can only ever touch a path under the
  # project's worktrees root.
  - run: |
      set -e
      worktree="{{ project.worktrees }}/{{ task.directory }}"
      if [ ! -d "$worktree" ]; then
        echo "no worktree at $worktree — nothing to tear down"
        exit 0
      fi
      if [ -d "$worktree/node_modules" ]; then
        echo "removing $(du -sh "$worktree/node_modules" | cut -f1) of dependencies"
        rm -rf "$worktree/node_modules"
      else
        echo "nothing installed in $worktree"
      fi
