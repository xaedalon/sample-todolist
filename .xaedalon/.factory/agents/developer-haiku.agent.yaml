name: developer-haiku
description: Code implementation.
provider: claude
model: haiku
effort: medium
session: task
# Factory's Default profile runs Claude with --restricted and
# --permission-prompts none, so any command that needs approval is denied.
# From Claude Code 2.1.281 that includes pnpm, and the agent could no longer
# install dependencies or run `pnpm check`. This lets pnpm through and nothing
# else: a write outside the workspace is still refused (checked 2026-09-23).
args: ['--allowedTools', 'Bash(pnpm *)']
