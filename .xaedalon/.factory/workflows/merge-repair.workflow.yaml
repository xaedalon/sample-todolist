# The merge's second chance.
#
# Named by `on_fail:` on the `merge` workflow, which is how Factory offers a
# recovery run: it starts before the task is blocked, shares the task's own
# agent session, and its own `on_fail` is ignored so a recovery cannot start
# another one. What it cannot do is move the task — the workflow that failed
# does that once the recovery is over — so this leaves the task blocked with
# the repair already attempted and written down. One Retry then lands it.
#
# No `needs`, deliberately: like the two cleanup workflows this has to be
# runnable on its own, which is how you would use it on a merge you fixed by
# hand and want checked before retrying.
kind: factory.workflow/v1
name: merge-repair
description: When the merge fails, put the branch back in a state that can be merged.
conditions:
  requires:
    - hasWorktree
phases:
  - merge-recover
