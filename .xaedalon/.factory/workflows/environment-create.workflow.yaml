# Make the task's worktree ready to be worked in.
#
# Factory's built-in copy does nothing but tell you to write this one, because
# an environment is whatever *this* project needs and no built-in could guess.
# For a todo app with no server the answer is small and it is not nothing:
# the dependencies belong to the worktree rather than to the repository, and
# two tasks installing into one `node_modules` is the race that worktrees
# exist to avoid.
#
# `needs: worktree-create` is what puts it in the plan at the right point;
# `requires: hasWorktree` is what stops it running if the worktree is not
# actually there. Assembly and gating are different questions and this workflow
# answers both.
kind: factory.workflow/v1
name: environment-create
description: Prepares the task's worktree — checks what the pipeline needs, installs dependencies.
needs:
  - worktree-create
conditions:
  requires:
    - hasWorktree
  provides:
    - hasEnvironment
phases:
  - environment-build
