# Take the worktree away.
#
# Not part of the chain: `needs` assembles a task's plan by pulling in
# predecessors, so a `needs:` here would make it impossible to run this on its
# own — and running it on its own is exactly what you want for a task you have
# decided to abandon. The happy path reaches it another way: `merge` ends with
# the same two phases, so a task that merged cleans up after itself.
#
# `clears: hasWorktree` is the reverse of what `worktree-create` provides, so
# anything gated on a worktree stops being runnable once this has run.
kind: factory.workflow/v1
name: worktree-delete
description: Removes the task's worktree, if its work has been merged.
conditions:
  requires: []
  clears:
    - hasWorktree
phases:
  - worktree-remove
