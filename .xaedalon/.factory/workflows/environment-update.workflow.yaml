# Bring an existing environment back in line with the repository.
#
# It runs `environment-build` again rather than having a phase of its own,
# because for this project building and refreshing are the same operation: the
# phase is idempotent, so running it twice is how you refresh it. A second file
# that ran `npm ci` slightly differently would be one more place for the two to
# drift apart.
#
# Run it by hand — after an agent adds a dependency mid-task, say. It neither
# provides nor clears `hasEnvironment`: the environment existed before and
# exists after, so nothing gated on one should swing shut halfway through.
kind: factory.workflow/v1
name: environment-update
description: Re-runs the environment build, for when the manifest has changed under a task.
conditions:
  requires:
    - hasEnvironment
phases:
  - environment-build
